# Das Gerät ist ein Feld, kein `target`: Home Assistant erlaubt in `target`
# keine Gerätefilter mehr (hassfest, "use a device selector instead"). Ohne den
# Filter auf `model` stünden hier auch der Hub und fremde Geräte zur Auswahl.
#
# Alternativ nimmt jeder Dienst eine `entity_id` desselben Geräts — eine
# Automatisierung hat die meist zur Hand. Mindestens eines von beiden muss
# angegeben sein; der Dienst meldet sonst einen Fehler, statt still nichts zu
# tun.
force_on:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: energy_manager
          model: Verbraucher
    duration:
      required: true
      example: "01:00:00"
      default: "01:00:00"
      selector:
        duration:

clear_force:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: energy_manager
          model: Verbraucher

pause:
  fields:
    duration:
      required: false
      example: "02:00:00"
      selector:
        duration:

resume:
