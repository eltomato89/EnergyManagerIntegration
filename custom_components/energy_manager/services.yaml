# Die Ziel-Filter schränken auf Verbrauchergeräte ein: `model` ist der einzige
# Schlüssel, der Hub und Verbraucher unterscheidet. Wird trotzdem etwas anderes
# übergeben, weist der Dienst es zur Laufzeit mit einer Meldung ab, statt still
# nichts zu tun.
force_on:
  target:
    device:
      integration: energy_manager
      model: Verbraucher
  fields:
    duration:
      required: true
      example: "01:00:00"
      default: "01:00:00"
      selector:
        duration:

clear_force:
  target:
    device:
      integration: energy_manager
      model: Verbraucher

pause:
  fields:
    duration:
      required: false
      example: "02:00:00"
      selector:
        duration:

resume:
