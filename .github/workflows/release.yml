name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements_test.txt

      # Bewusst hier und nicht nur in der CI: Die läuft auf Branches, nicht auf
      # Tags. Ein Release, dessen Tests rot sind, soll gar nicht erst entstehen.
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest tests/ -q

      # Läuft die Version im Manifest dem Tag hinterher, bietet HACS das Update
      # endlos erneut an: Es vergleicht die installierte Manifest-Version mit
      # dem Release-Tag.
      - name: Manifest-Version muss zum Tag passen
        run: |
          MANIFEST=$(python -c "import json;print(json.load(open('custom_components/energy_manager/manifest.json'))['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          test "$MANIFEST" = "$TAG" || { echo "manifest.json=$MANIFEST != Tag=$TAG"; exit 1; }

      # Ohne dieses Flag landet eine Vorabfassung als regulaeres Release: GitHub
      # setzt sie auf "Latest", und HACS bietet sie damit allen an statt nur
      # denen, die Betas eingeschaltet haben. Massstab ist der Tag selbst --
      # reine x.y.z-Tags sind stabil, alles andere (0.4.0b3, 0.6.0-beta.2) nicht.
      - name: Vorabfassung am Tag erkennen
        id: art
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # HACS installiert den Ordner custom_components/energy_manager direkt aus
      # dem Tag (zip_release: false). Es braucht deshalb kein Asset, nur einen
      # Release-Eintrag, an dem HACS die Version erkennt.
      # Die Release-Notiz ist von Hand geschrieben und auf Englisch: Sie ist das,
      # was HACS beim Update anzeigt. Der CHANGELOG ist deutsch und ausfuehrlich
      # und taugt dafuer nicht. Geprueft wird, dass sie die Fassung nennt --
      # sonst stuende beim naechsten Release die Notiz des vorigen dort.
      - name: Release-Notiz nennt die veroeffentlichte Fassung
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q -- "$VERSION" RELEASE_NOTES.md \
            || { echo "RELEASE_NOTES.md nennt $VERSION nicht"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ steps.art.outputs.prerelease }}
