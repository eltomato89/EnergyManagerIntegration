[project]
name = "energy-manager-integration"
version = "0.1.0"
description = "Home-Assistant-Integration für PV-Überschusssteuerung"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Die Testbibliothek erzeugt eine Menge Deprecation-Warnungen aus HA selbst;
# die eigenen sollen dennoch sichtbar bleiben.
filterwarnings = ["ignore::DeprecationWarning:homeassistant.*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",
    "ASYNC",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
